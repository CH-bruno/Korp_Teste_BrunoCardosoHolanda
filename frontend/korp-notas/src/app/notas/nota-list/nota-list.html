<div class="nota-list-container">
  <div class="header">
    <h1>Notas Fiscais</h1>
    <button mat-stroked-button color="primary" routerLink="/notas/nova">
      <mat-icon>add</mat-icon>
      Nova Nota
    </button>
  </div>

  @if (carregando) {
    <div class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <table mat-table [dataSource]="notas" class="mat-elevation-z2">

      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let nota">{{ nota.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let nota">
          <mat-chip [class.chip-aberta]="nota.status === 'Aberta'" [color]="nota.status === 'Fechada' ? 'primary' : undefined" selected>
            {{ nota.status }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="dataCriacao">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let nota">{{ nota.dataCriacao | date:'dd/MM/yyyy \'às\' HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>Itens</th>
        <td mat-cell *matCellDef="let nota">{{ nota.itens.length }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let nota">
          <button mat-icon-button [routerLink]="['/notas', nota.id]">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas;"></tr>
    </table>

    @if (notas.length === 0) {
      <div class="empty-state">
        <mat-icon>description</mat-icon>
        <p>Nenhuma nota fiscal cadastrada.</p>
      </div>
    }
  }
</div>
